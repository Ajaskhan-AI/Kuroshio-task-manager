<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuroshio Task Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg:#f4f6f7; --surface:#fff; --surface-2:#eef2f3; --line:#d9e0e2;
    --fg:#16242a; --muted:#5e7079; --accent:#0b7a86; --accent-ink:#fff;
    --todo:#8a97a0; --prog:#c88a2e; --done:#2e9e6b; --danger:#c0493b;
    --shadow:0 1px 2px rgba(16,36,42,.06),0 4px 14px rgba(16,36,42,.05);
    --radius:12px; --font:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0c1518;--surface:#132227;--surface-2:#0f1c20;--line:#22363c;
      --fg:#e7eef0;--muted:#8fa3ab;--accent:#2bb3c0;--accent-ink:#042227;
      --prog:#e0a847;--done:#46c78b;--danger:#e07163;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);color-scheme:dark;}
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.45;
    padding:env(safe-area-inset-top,0) 0 40px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;
    padding-inline:max(16px,env(safe-area-inset-left,0)) max(16px,env(safe-area-inset-right,0));}
  input,select,textarea,button{font:inherit;color:inherit;}
  .field{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none;width:100%;}
  .field:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent);}
  .btn{border:1px solid transparent;border-radius:9px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);cursor:pointer;}
  .btn:hover{filter:brightness(1.06);} .btn:disabled{opacity:.5;cursor:default;}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--fg);}
  .link{background:none;border:none;color:var(--accent);cursor:pointer;font-weight:600;padding:0;}

  /* AUTH */
  .auth{min-height:88vh;display:grid;place-items:center;}
  .card-auth{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    width:100%;max-width:380px;padding:28px 24px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#063));
    display:grid;place-items:center;color:var(--accent-ink);flex:none;}
  .mark svg{width:20px;height:20px;}
  h1{font-size:1.2rem;font-weight:700;margin:0;letter-spacing:-.01em;}
  .tag{color:var(--muted);font-size:.85rem;margin:2px 0 20px;}
  .form{display:flex;flex-direction:column;gap:11px;}
  .msg{font-size:.84rem;border-radius:8px;padding:9px 11px;margin-top:4px;}
  .msg.err{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);}
  .msg.ok{background:color-mix(in srgb,var(--done) 14%,transparent);color:var(--done);}
  .switch{text-align:center;font-size:.85rem;color:var(--muted);margin-top:16px;}

  /* APP */
  header.top{position:sticky;top:env(safe-area-inset-top,0);z-index:10;
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding-block:13px;}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0);background:var(--bg);z-index:11;}
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .topbar h1{font-size:1.05rem;}
  .me{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.84rem;color:var(--muted);}
  .rolechip{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    border:1px solid var(--line);border-radius:20px;padding:2px 8px;color:var(--accent);}

  .addbar{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;}
  .addbar>*{min-width:0;} #t-title{flex:1 1 220px;} #t-assignee,#t-due,#t-priority{flex:0 1 150px;width:auto;}
  .addbar .btn{flex:none;}

  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px;align-items:start;}
  @media (max-width:760px){.board{grid-template-columns:1fr;}}
  .col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px;min-height:90px;}
  .col-head{display:flex;align-items:center;gap:8px;margin:2px 2px 12px;}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .c-todo .dot{background:var(--todo);} .c-prog .dot{background:var(--prog);} .c-done .dot{background:var(--done);}
  .col-head h2{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:0;}
  .count{margin-left:auto;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;
    background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1px 9px;}
  .cards{display:flex;flex-direction:column;gap:10px;}
  .tcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;box-shadow:var(--shadow);}
  .tcard.done .t-title{text-decoration:line-through;color:var(--muted);}
  .t-title{font-weight:600;font-size:.95rem;margin:0 0 7px;overflow-wrap:anywhere;}
  .t-desc{font-size:.82rem;color:var(--muted);margin:0 0 8px;overflow-wrap:anywhere;}
  .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);}
  .pill{border-radius:20px;padding:1px 8px;font-weight:600;font-size:.7rem;border:1px solid var(--line);}
  .pill.high{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line));}
  .pill.med{color:var(--prog);border-color:color-mix(in srgb,var(--prog) 45%,var(--line));}
  .pill.low{color:var(--muted);}
  .due.over{color:var(--danger);font-weight:600;}
  .mine{color:var(--accent);font-weight:600;}
  .actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .mini{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:5px 9px;font-size:.76rem;font-weight:600;cursor:pointer;color:var(--fg);}
  .mini:hover{border-color:var(--accent);color:var(--accent);}
  .mini.del{margin-left:auto;color:var(--muted);} .mini.del:hover{color:var(--danger);border-color:var(--danger);}
  .empty{color:var(--muted);font-size:.82rem;padding:10px 4px;text-align:center;}

  details.team{margin-top:20px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:4px 14px;}
  details.team summary{cursor:pointer;font-weight:600;padding:9px 0;font-size:.9rem;}
  .member{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem;}
  .member .nm{font-weight:500;} .member .rl{color:var(--muted);font-size:.78rem;}
  .member .mini{margin-left:auto;}
  .hidden{display:none!important;}
  .foot{text-align:center;color:var(--muted);font-size:.78rem;margin-top:26px;}
</style>
</head>
<body>

<!-- AUTH VIEW -->
<section class="auth wrap" id="authView">
  <div class="card-auth">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c1.8-2 3.6-2 5.4 0s3.6 2 5.4 0 3.6-2 5.4 0"/><path d="M3 9c1.8-2 3.6-2 5.4 0s3.6 2 5.4 0 3.6-2 5.4 0"/></svg></span>
      <h1>Kuroshio Task Board</h1>
    </div>
    <p class="tag" id="authTag">Sign in to see your tasks.</p>
    <form class="form" id="authForm" autocomplete="on">
      <input class="field hidden" id="f-name" placeholder="Full name" autocomplete="name">
      <input class="field" id="f-email" type="email" placeholder="Work email" autocomplete="email" required>
      <input class="field" id="f-pass" type="password" placeholder="Password" autocomplete="current-password" required minlength="6">
      <button class="btn" id="authBtn" type="submit">Sign in</button>
    </form>
    <div id="authMsg"></div>
    <p class="switch" id="authSwitch"></p>
  </div>
</section>

<!-- APP VIEW -->
<div id="appView" class="hidden">
  <header class="top">
    <div class="wrap topbar">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c1.8-2 3.6-2 5.4 0s3.6 2 5.4 0 3.6-2 5.4 0"/><path d="M3 9c1.8-2 3.6-2 5.4 0s3.6 2 5.4 0 3.6-2 5.4 0"/></svg></span>
      <h1>Kuroshio Task Board</h1>
      <div class="me">
        <span id="meName"></span>
        <span class="rolechip" id="meRole"></span>
        <button class="btn ghost" id="logout">Sign out</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="addbar hidden" id="addbar">
      <input class="field" id="t-title" placeholder="New task — what needs doing?" maxlength="160">
      <select class="field" id="t-assignee" aria-label="Assign to"><option value="">Unassigned</option></select>
      <input class="field" id="t-due" type="date" aria-label="Due date">
      <select class="field" id="t-priority" aria-label="Priority">
        <option value="low">Low</option><option value="med" selected>Medium</option><option value="high">High</option>
      </select>
      <button class="btn" id="addBtn">Add task</button>
    </div>

    <div class="board">
      <section class="col c-todo"><div class="col-head"><span class="dot"></span><h2>To Do</h2><span class="count" id="n-todo">0</span></div><div class="cards" id="col-todo"></div></section>
      <section class="col c-prog"><div class="col-head"><span class="dot"></span><h2>In Progress</h2><span class="count" id="n-prog">0</span></div><div class="cards" id="col-prog"></div></section>
      <section class="col c-done"><div class="col-head"><span class="dot"></span><h2>Done</h2><span class="count" id="n-done">0</span></div><div class="cards" id="col-done"></div></section>
    </div>

    <details class="team hidden" id="teamPanel">
      <summary>Team &amp; roles</summary>
      <div id="teamList"></div>
    </details>

    <p class="foot">Kuroshio AI · tasks sync live across everyone signed in</p>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  "use strict";
  var SUPABASE_URL = "https://nqoejusnvfexouvoaiag.supabase.co";
  var SUPABASE_KEY = "sb_publishable_Eo4jnOySrujh6xscDHPoNg_uT6HoJMD";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var $ = function(id){ return document.getElementById(id); };
  var state = { user:null, profile:null, tasks:[], members:[], mode:"signin" };

  // ---------- AUTH UI ----------
  function setMode(m){
    state.mode = m;
    var signup = m === "signup";
    $("f-name").classList.toggle("hidden", !signup);
    $("f-pass").setAttribute("autocomplete", signup ? "new-password" : "current-password");
    $("authBtn").textContent = signup ? "Create account" : "Sign in";
    $("authTag").textContent = signup ? "Create your account to join the board." : "Sign in to see your tasks.";
    $("authSwitch").innerHTML = signup
      ? 'Already have an account? <button class="link" id="toSignin">Sign in</button>'
      : 'New here? <button class="link" id="toSignup">Create an account</button>';
    var a = $("toSignin"), b = $("toSignup");
    if(a) a.onclick = function(){ setMode("signin"); clearMsg(); };
    if(b) b.onclick = function(){ setMode("signup"); clearMsg(); };
  }
  function msg(text, kind){ $("authMsg").innerHTML = '<div class="msg '+kind+'">'+text+'</div>'; }
  function clearMsg(){ $("authMsg").innerHTML = ""; }

  $("authForm").addEventListener("submit", function(e){
    e.preventDefault();
    clearMsg();
    var email = $("f-email").value.trim();
    var pass = $("f-pass").value;
    var btn = $("authBtn"); btn.disabled = true;
    if(state.mode === "signup"){
      var name = $("f-name").value.trim();
      if(!name){ msg("Please enter your name.", "err"); $("f-name").focus(); btn.disabled = false; return; }
      sb.auth.signUp({ email:email, password:pass, options:{ data:{ full_name:name } } })
        .then(function(res){
          btn.disabled = false;
          if(res.error){ msg(res.error.message, "err"); return; }
          if(res.data.session){ /* auto signed in */ }
          else { msg("Account created. Check your email to confirm, then sign in.", "ok"); setMode("signin"); }
        });
    } else {
      sb.auth.signInWithPassword({ email:email, password:pass })
        .then(function(res){
          btn.disabled = false;
          if(res.error){ msg(res.error.message, "err"); }
        });
    }
  });

  $("logout").addEventListener("click", function(){ sb.auth.signOut(); });

  // ---------- SESSION ----------
  sb.auth.onAuthStateChange(function(_evt, session){
    if(session && session.user){ onSignedIn(session.user); }
    else { onSignedOut(); }
  });
  sb.auth.getSession().then(function(res){
    if(res.data.session){ onSignedIn(res.data.session.user); }
  });

  var channel = null;
  function onSignedIn(user){
    state.user = user;
    loadProfile().then(function(){
      $("authView").classList.add("hidden");
      $("appView").classList.remove("hidden");
      var admin = state.profile && state.profile.role === "admin";
      $("meName").textContent = (state.profile && state.profile.full_name) || user.email;
      $("meRole").textContent = admin ? "Admin" : "Member";
      $("addbar").classList.toggle("hidden", !admin);
      $("teamPanel").classList.toggle("hidden", !admin);
      if(admin){ loadMembers(); }
      loadTasks();
      subscribe();
    });
  }
  function onSignedOut(){
    state.user = null; state.profile = null; state.tasks = []; state.members = [];
    if(channel){ sb.removeChannel(channel); channel = null; }
    $("appView").classList.add("hidden");
    $("authView").classList.remove("hidden");
    setMode("signin"); clearMsg();
    $("f-email").value=""; $("f-pass").value=""; $("f-name").value="";
  }

  function loadProfile(){
    return sb.from("profiles").select("id,full_name,role").eq("id", state.user.id).single()
      .then(function(res){ state.profile = res.data || { role:"member", full_name:"" }; });
  }

  // ---------- TASKS ----------
  function loadTasks(){
    return sb.from("tasks")
      .select("id,title,description,status,priority,due_date,assignee_id,profiles:assignee_id(full_name)")
      .then(function(res){
        if(res.error){ console.warn(res.error); return; }
        state.tasks = res.data || [];
        renderBoard();
      });
  }
  function subscribe(){
    if(channel) return;
    channel = sb.channel("tasks-rt")
      .on("postgres_changes", { event:"*", schema:"public", table:"tasks" }, function(){ loadTasks(); })
      .subscribe();
  }

  function renderBoard(){
    var cols = { todo:$("col-todo"), in_progress:$("col-prog"), done:$("col-done") };
    cols.todo.textContent=""; cols.in_progress.textContent=""; cols.done.textContent="";
    var c = { todo:0, in_progress:0, done:0 };
    var order = { high:0, med:1, low:2 };
    state.tasks.slice().sort(function(a,b){
      return (order[a.priority]||1)-(order[b.priority]||1);
    }).forEach(function(t){
      var st = (t.status==="in_progress"||t.status==="done") ? t.status : "todo";
      c[st]++;
      cols[st].appendChild(taskCard(t, st));
    });
    $("n-todo").textContent=c.todo; $("n-prog").textContent=c.in_progress; $("n-done").textContent=c.done;
    [["todo",cols.todo],["in_progress",cols.in_progress],["done",cols.done]].forEach(function(p){
      if(c[p[0]]===0){ var e=document.createElement("div"); e.className="empty"; e.textContent="Nothing here"; p[1].appendChild(e); }
    });
  }

  function taskCard(t, st){
    var admin = state.profile.role === "admin";
    var mine = t.assignee_id === state.user.id;
    var card = document.createElement("div");
    card.className = "tcard" + (st==="done"?" done":"");

    var h = document.createElement("p"); h.className="t-title"; h.textContent=t.title||"Untitled task"; card.appendChild(h);
    if(t.description){ var d=document.createElement("p"); d.className="t-desc"; d.textContent=t.description; card.appendChild(d); }

    var meta = document.createElement("div"); meta.className="meta";
    var who = document.createElement("span");
    var nm = t.profiles && t.profiles.full_name;
    if(mine){ who.className="mine"; who.textContent="You"; }
    else { who.textContent = nm ? nm : "Unassigned"; }
    meta.appendChild(who);
    var pill=document.createElement("span"); pill.className="pill "+(t.priority||"med");
    pill.textContent={high:"High",med:"Medium",low:"Low"}[t.priority]||"Medium"; meta.appendChild(pill);
    if(t.due_date){ meta.appendChild(dueEl(t.due_date)); }
    card.appendChild(meta);

    var canMove = admin || mine;
    if(canMove){
      var row=document.createElement("div"); row.className="actions";
      if(st!=="todo") row.appendChild(mini("◀ To Do", function(){ setStatus(t,"todo"); }));
      if(st!=="in_progress") row.appendChild(mini(st==="done"?"◀ In Progress":"Start ▶", function(){ setStatus(t,"in_progress"); }));
      if(st!=="done") row.appendChild(mini("Done ✓", function(){ setStatus(t,"done"); }));
      if(admin){ var del=mini("Delete", function(){ removeTask(t); }); del.className="mini del"; row.appendChild(del); }
      card.appendChild(row);
    }
    return card;
  }
  function dueEl(d){
    var p=d.split("-"); var dt=new Date(+p[0],+p[1]-1,+p[2]);
    var today=new Date(); today.setHours(0,0,0,0);
    var s=document.createElement("span");
    s.className="due"+(dt<today?" over":"");
    s.textContent="◷ "+dt.toLocaleDateString(undefined,{day:"numeric",month:"short"});
    return s;
  }
  function mini(label, fn){ var b=document.createElement("button"); b.className="mini"; b.textContent=label; b.onclick=fn; return b; }

  function setStatus(t, status){
    // optimistic
    t.status = status; renderBoard();
    sb.from("tasks").update({ status:status }).eq("id", t.id).then(function(res){
      if(res.error){ console.warn(res.error); loadTasks(); }
    });
  }
  function removeTask(t){
    sb.from("tasks").delete().eq("id", t.id).then(function(res){ if(res.error) console.warn(res.error); else loadTasks(); });
  }

  $("addBtn").addEventListener("click", addTask);
  $("t-title").addEventListener("keydown", function(e){ if(e.key==="Enter") addTask(); });
  function addTask(){
    var title=$("t-title").value.trim(); if(!title){ $("t-title").focus(); return; }
    var row = {
      title:title,
      assignee_id: $("t-assignee").value || null,
      due_date: $("t-due").value || null,
      priority: $("t-priority").value,
      status:"todo",
      created_by: state.user.id
    };
    $("addBtn").disabled=true;
    sb.from("tasks").insert(row).then(function(res){
      $("addBtn").disabled=false;
      if(res.error){ alert("Couldn't add task: "+res.error.message); return; }
      $("t-title").value=""; $("t-due").value=""; $("t-assignee").value=""; $("t-title").focus();
      loadTasks();
    });
  }

  // ---------- TEAM (admin) ----------
  function loadMembers(){
    sb.from("profiles").select("id,full_name,role").order("full_name").then(function(res){
      if(res.error){ return; }
      state.members = res.data || [];
      fillAssignees(); renderTeam();
    });
  }
  function fillAssignees(){
    var sel=$("t-assignee");
    sel.innerHTML='<option value="">Unassigned</option>';
    state.members.forEach(function(m){
      var o=document.createElement("option"); o.value=m.id;
      o.textContent=(m.full_name||"(no name)")+(m.id===state.user.id?" (you)":"");
      sel.appendChild(o);
    });
  }
  function renderTeam(){
    var box=$("teamList"); box.textContent="";
    state.members.forEach(function(m){
      var row=document.createElement("div"); row.className="member";
      var nm=document.createElement("span"); nm.className="nm"; nm.textContent=m.full_name||"(no name)";
      var rl=document.createElement("span"); rl.className="rl"; rl.textContent=m.role;
      row.appendChild(nm); row.appendChild(rl);
      if(m.role!=="admin"){
        var b=mini("Make admin", function(){ promote(m); }); row.appendChild(b);
      }
      box.appendChild(row);
    });
  }
  function promote(m){
    sb.from("profiles").update({ role:"admin" }).eq("id", m.id).then(function(res){
      if(res.error){ alert("Couldn't update role: "+res.error.message); return; }
      loadMembers();
    });
  }

  setMode("signin");
})();
</script>
</body>
</html>
